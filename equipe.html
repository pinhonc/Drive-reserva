<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>Painel da equipe — Drive In Burger</title>
<link rel="icon" href="assets/logo.jpg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
</head>
<body class="wide">
<div id="app">
  <header class="topbar">
    <img src="assets/logo.jpg" alt="Drive In Burger">
    <div class="brand"><span class="name">DRIVE IN BURGER</span><span class="tag">Painel da equipe</span></div>
    <div class="right"><span id="who" style="font-size:13px;color:var(--gold-soft)"></span><button class="link-btn" id="logout" hidden>Sair</button></div>
  </header>

  <main id="root">
    <!-- LOGIN -->
    <section id="vLogin" hidden>
      <div class="card" style="max-width:400px;margin:20px auto">
        <h2 style="text-align:center;margin-bottom:4px">Acesso da equipe</h2>
        <p class="hint" style="text-align:center;margin:0 0 18px">Fila de espera, reservas e mesas</p>
        <div class="notice err" id="loginErr" hidden></div>
        <form id="loginForm">
          <div class="field"><label for="email">E-mail</label><input type="email" id="email" autocomplete="username" required></div>
          <div class="field"><label for="senha">Senha</label><input type="password" id="senha" autocomplete="current-password" required></div>
          <button class="btn btn-primary" type="submit" id="loginBtn">Entrar</button>
        </form>
      </div>
    </section>

    <!-- SEM PERMISSÃO -->
    <section id="vDenied" hidden>
      <div class="card" style="max-width:460px;margin:20px auto;text-align:center">
        <h2>Sem permissão</h2>
        <p>Este usuário ainda não foi liberado para o painel. Peça à gerência para cadastrá-lo na equipe.</p>
        <button class="btn btn-secondary" id="deniedOut">Sair</button>
      </div>
    </section>

    <!-- APP -->
    <section id="vApp" hidden>
      <nav class="tabs" id="tabs">
        <button data-tab="fila" class="active">Fila <span class="badge" id="bFila">0</span></button>
        <button data-tab="reservas">Reservas <span class="badge" id="bRes" hidden>0</span></button>
        <button data-tab="mesas">Mesas</button>
        <button data-tab="rel">Relatórios</button>
        <button data-tab="ajustes">Ajustes</button>
      </nav>
      <div id="pane"></div>
    </section>
  </main>
</div>
<div id="modalRoot"></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="https://cdn.jsdelivr.net/npm/qrcode-generator@1.4.4/qrcode.js"></script>
<script src="config.js"></script>
<script src="js/common.js"></script>
<script src="js/equipe.js"></script>
</body>
</html>
